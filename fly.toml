# fly.toml app configuration file generated for serin-web on 2026-07-26T22:30:44-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'serin-web'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[[mounts]]
  source = 'serin_data'
  destination = '/data'

[http_service]
  internal_port = 8890
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/v1/version'

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
