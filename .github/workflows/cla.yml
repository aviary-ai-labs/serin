name: CLA

# Gate every external PR on the Contributor License Agreement (CLA.md).
# Signatures are recorded as JSON on the `cla-signatures` branch of this
# repo — no external service, auditable history. The repo owner is
# allowlisted (sole copyright holder; the CLA exists for everyone else).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/aviary-ai-labs/serin/blob/main/CLA.md
          branch: cla-signatures
          allowlist: aviary-ai-labs,dependabot[bot]
          custom-notsigned-prcomment: >
            Thanks for the contribution! Before we can merge, please read the
            [CLA](https://github.com/aviary-ai-labs/serin/blob/main/CLA.md) (short
            version: you keep your copyright; you license the contribution so
            the AGPL core can also ship inside commercial Serin builds — and
            the core stays free forever). To sign, reply with the sentence
            below. Prefer not to sign? You can always ship your work as an
            [out-of-tree plugin](https://github.com/aviary-ai-labs/serin/blob/main/CONTRIBUTING.md)
            instead.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "CLA signed — thank you! ✅"
