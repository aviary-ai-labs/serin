<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Serin Logo Options</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #d9e4df;
      --text: #17231f;
      --muted: #7b8c84;
      --blue: #2f6f9f;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: "DM Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 0%, rgba(15, 138, 95, 0.08), transparent 28%),
        radial-gradient(circle at 88% 10%, rgba(47, 111, 159, 0.08), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 36px 28px 56px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-family: var(--mono);
      font-size: 22px;
      letter-spacing: 0;
    }

    p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    a {
      color: var(--blue);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      display: grid;
      gap: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      box-shadow: 0 12px 34px rgba(31, 55, 48, 0.07);
      padding: 20px;
    }

    .card:first-child {
      grid-column: 1 / -1;
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .logo-frame {
      display: grid;
      place-items: center;
      min-height: 170px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fbfdfc;
      padding: 20px;
    }

    .logo-frame img {
      display: block;
      width: min(100%, 460px);
      height: auto;
    }

    .dark {
      background: #17231f;
    }

    .dark img {
      filter: drop-shadow(0 14px 34px rgba(0, 0, 0, 0.2));
    }

    @media (max-width: 760px) {
      main { padding: 24px 16px 40px; }
      header { align-items: start; flex-direction: column; }
      .grid { grid-template-columns: 1fr; }
      .card:first-child { grid-column: auto; }
      .logo-frame { min-height: 130px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Serin Logo Options</h1>
        <p>Five vector directions. Pick one and I can apply it across the app, landing page, and favicon.</p>
      </div>
      <a href="/">Back to app</a>
    </header>

    <section class="grid" aria-label="Logo options">
      <article class="card">
        <div class="card-head"><span>Option 1</span><span>Signal F</span></div>
        <div class="logo-frame"><img src="/logo-options/serin-logo-1.svg" alt="Serin logo option 1"></div>
      </article>
      <article class="card">
        <div class="card-head"><span>Option 2</span><span>Lens</span></div>
        <div class="logo-frame"><img src="/logo-options/serin-logo-2.svg" alt="Serin logo option 2"></div>
      </article>
      <article class="card">
        <div class="card-head"><span>Option 3</span><span>Allocation</span></div>
        <div class="logo-frame"><img src="/logo-options/serin-logo-3.svg" alt="Serin logo option 3"></div>
      </article>
      <article class="card">
        <div class="card-head"><span>Option 4</span><span>Private AI</span></div>
        <div class="logo-frame"><img src="/logo-options/serin-logo-4.svg" alt="Serin logo option 4"></div>
      </article>
      <article class="card">
        <div class="card-head"><span>Option 5</span><span>Terminal</span></div>
        <div class="logo-frame"><img src="/logo-options/serin-logo-5.svg" alt="Serin logo option 5"></div>
      </article>
    </section>
  </main>
</body>
</html>
